name: CI

on:
  push:
    branches:
      - prototype
  pull_request:
    branches:
      - prototype
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, and test coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (allow documented test baseline only)
        run: bash scripts/ci-typecheck.sh

      - name: Test with enforced coverage gates
        run: npm run test:coverage
